name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name AlbionFishingBot
          --icon packaging/icon.ico
          --paths .
          --add-data "fishbot/web;fishbot/web"
          --collect-submodules fishbot
          --collect-all pycaw
          --collect-submodules comtypes
          packaging/launcher.py

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist/AlbionFishingBot.exe -ArgumentList "--demo","--browser","--port","8790","--data","$env:RUNNER_TEMP\smoke" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $ok = (Invoke-WebRequest http://127.0.0.1:8790/ -UseBasicParsing).Content -match "Albion Fishing Bot" } catch {}
          }
          Stop-Process -Name AlbionFishingBot -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\smoke\fishbot.log" -ErrorAction SilentlyContinue; throw "exe did not serve the UI" }

      - name: Storage + uninstall test (registry, nothing left behind)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "uninst"
          $reg = "HKCU:\Software\AlbionFishingBot"
          $files = Join-Path $env:LOCALAPPDATA "AlbionFishingBot"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item dist/AlbionFishingBot.exe $d
          $p = Start-Process "$d\AlbionFishingBot.exe" -ArgumentList "--demo","--browser","--port","8791" -PassThru
          for ($i = 0; $i -lt 90 -and -not (Test-Path "$reg\profiles\Demo"); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          Stop-Process -Name AlbionFishingBot -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          if (-not (Test-Path "$reg\profiles\Demo")) { throw "profiles were not stored in the registry" }
          if (Test-Path "$d\data") { throw "the exe created a data folder next to itself" }
          Start-Process "$d\AlbionFishingBot.exe" -ArgumentList "--uninstall" -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path $d) -or (Test-Path $files)); $i++) { Start-Sleep 1 }
          if (Test-Path $reg) { throw "registry key left behind" }
          if (Test-Path $files) { Get-ChildItem -Recurse $files; throw "files left in LOCALAPPDATA" }
          if (Test-Path $d) { Get-ChildItem -Recurse $d; throw "exe folder left behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: AlbionFishingBot
          path: dist/AlbionFishingBot.exe

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else echo "tag=v$(python -c 'import fishbot; print(fishbot.__version__)')" >> "$GITHUB_OUTPUT"; fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Albion Fishing Bot ${{ steps.ver.outputs.tag }}
          make_latest: true
          files: dist/AlbionFishingBot.exe
          body: |
            **AlbionFishingBot.exe** — один файл, установка не нужна. Просто запустите: настройки хранятся в реестре, рядом с exe ничего не появляется. Обновляется сам, удаляется кнопкой в настройках без следов.

            - Windows 10/11 (окно использует WebView2 — он есть в системе; без него интерфейс откроется в браузере)
            - Попробовать без игры: `AlbionFishingBot.exe --demo`
            - Первый запуск чуть дольше: exe распаковывается во временную папку
            - Файл не подписан: SmartScreen может предупредить → «Подробнее» → «Выполнить в любом случае»

            Калибровка и настройки — в [README](https://github.com/${{ github.repository }}#-как-пользоваться).
