<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Albion Fishing Bot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d0d0f'/%3E%3Cpath d='M6 27Q13 15 24 7' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M24 7v12' stroke='%23fff' stroke-width='1'/%3E%3Ccircle cx='24' cy='21' r='2.6' fill='%23ff5d6c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <ellipse class="ripple" cx="25" cy="23.3" rx="3.6" ry="1"/>
            <ellipse class="ripple r2" cx="25" cy="23.3" rx="3.6" ry="1"/>
            <g class="rod">
              <path class="pole" d="M3.5 29 Q12 14 25 4.5"/>
              <path class="grip" d="M3.5 29 L7.6 22.6"/>
              <circle class="reel" cx="9" cy="23.4" r="1.9"/>
              <g class="tackle">
                <line class="fline" x1="25" y1="4.5" x2="25" y2="20.6"/>
                <g class="bob"><path class="bob-top" d="M22.6 22.4a2.4 2.4 0 0 1 4.8 0z"/><path class="bob-bot" d="M22.6 22.4a2.4 2.4 0 0 0 4.8 0z"/></g>
              </g>
            </g>
          </svg>
        </div>
        <div class="name"><b>Albion Fishing Bot</b><span>v<span id="version"></span><span class="demo" id="demo-tag" data-t="demo" hidden></span></span></div>
      </div>
      <div class="loot" id="loot" hidden></div>
      <div class="top-r">
        <button class="update-chip" id="update-chip" hidden></button>
        <button class="btn sm" id="lang"></button>
      </div>
    </header>

    <main class="grid">
      <section class="card status" id="status"></section>
      <section class="card settings" id="settings"></section>
      <section class="card vision" id="vision"></section>
    </main>

    <footer class="foot">
      <a class="credit" href="https://github.com/mitaro-cs" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span data-t="credit"></span> <b>mitaro-cs</b> <span>and</span> <b>pulsar</b>
      </a>
    </footer>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
