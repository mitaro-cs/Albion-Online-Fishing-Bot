[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "albion-fishing-bot"
dynamic = ["version"]
description = "Screen-vision fishing bot for Albion Online with a predictive reel controller and a node-based UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "mss>=9.0",
  "pynput>=1.7.6",
  "pywebview>=5.0",
  "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
albion-fishbot = "fishbot.__main__:main"

[tool.setuptools]
packages = ["fishbot"]

[tool.setuptools.dynamic]
version = { attr = "fishbot.__version__" }

[tool.setuptools.package-data]
fishbot = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
